name: Release

# Tag-triggered release. Codeberg is the canonical origin and auto-mirrors to
# this GitHub repo; a vX.Y.Z tag here builds + tests, attaches the source zip to
# a GitHub Release, publishes to PGXN, and announces.
#
# HISTORY (2026-09-17): PGXN publishing and the announcement originally lived
# ONLY in a Codeberg (.forgejo) release workflow, with this file explicitly
# deferring to it.  Codeberg provides no shared Actions runners, so that
# workflow never executed -- not once in 115 queued runs -- and PGXN sat at
# 0.2.0 while 45 releases shipped to 1.8.2.  Every release channel now lives in
# the ONE workflow that actually runs.  PGXN rejects duplicate versions, so a
# re-run of a published tag reports 409 and moves on rather than failing.
on:
  push:
    tags:
      - 'v*'
  # Manual re-publish of an EXISTING tag.  Added 2026-09-17 so the PGXN gap
  # (0.2.0 -> 1.8.2, caused by publishing living in a workflow that never ran)
  # could be closed without re-tagging, which would rewrite published history.
  # `gh run rerun` is not enough: it re-executes the workflow definition the tag
  # was pushed under, i.e. the old one without the PGXN step.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)publish, e.g. v1.8.2'
        required: true
        type: string

permissions:
  contents: write   # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the tag + full history for `git archive`
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release version
        id: ver
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # THE CHECKOUT MUST BE THE RELEASE IT CLAIMS TO BE.
      #
      # Codeberg is the origin and mirrors to GitHub.  The mirror pushes main and the
      # tag as separate ref updates, and the tag-push event can fire while GitHub's
      # refs/tags/vX.Y.Z still resolves to the PREVIOUS release's commit -- a race of a
      # few seconds that exists on every release.  On v1.8.4 it landed: the job checked
      # out v1.8.3's commit, built pg_fts-1.8.3.zip, and failed only because the
      # filename did not match.  Had it matched, this workflow would have published the
      # previous release's code under the new tag.
      #
      # So: (1) re-fetch the tag until the checked-out META.json version equals the
      # tag's version, bounded; (2) if it never does, FAIL -- never build a mislabelled
      # artifact.  (1) tolerates the race; (2) is the invariant and is what matters.
      - name: Verify checkout matches the tag (mirror race guard)
        run: |
          WANT="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          for i in $(seq 1 12); do
            GOT=$(grep -m1 '"version"' META.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
            if [ "$GOT" = "$WANT" ]; then
              echo "checkout is $GOT for tag $TAG (attempt $i)"; exit 0
            fi
            echo "checkout says $GOT but tag is $TAG; mirror may still be catching up -- refetching ($i/12)"
            sleep 10
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
            git checkout -q --detach "refs/tags/$TAG" || true
          done
          echo "::error::checked out version $GOT does not match tag $TAG after 2 minutes; refusing to build a mislabelled release"
          exit 1

      - name: Install PostgreSQL 17 + server headers
        run: |
          # Remove just the runner's preinstalled Microsoft apt repo (it can
          # serve a broken InRelease and fail `apt-get update`); keep the
          # LLVM/ubuntu repos — postgresql-server-dev depends on clang.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources || true
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-17 postgresql-server-dev-17 gcc make zip libipc-run-perl

      - name: Build + test (gate the release)
        run: |
          PGBIN=/usr/lib/postgresql/17/bin
          make PG_CONFIG=$PGBIN/pg_config
          sudo make install PG_CONFIG=$PGBIN/pg_config
          # REGRESS + ISOLATION are the release gate. PGXS ignores a CLI
          # TAP_TESTS override; PROVE_TESTS points prove at a trivial always-pass
          # file so the TAP stage is a no-op (TAP runs in CI, not required to publish).
          pg_virtualenv -v 17 make installcheck PROVE_TESTS=ci/noop.pl PG_CONFIG=$PGBIN/pg_config

      - name: Build source distribution (PGXN zip)
        id: dist
        run: |
          make dist PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config
          echo "zip=pg_fts-${{ steps.ver.outputs.version }}.zip" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.dist.outputs.zip }}

      - name: Publish to PGXN
        env:
          PGXN_USERNAME: ${{ secrets.PGXN_USER }}
          PGXN_PASSWORD: ${{ secrets.PGXN_PASSWORD }}
        run: |
          if [ -z "$PGXN_USERNAME" ] || [ -z "$PGXN_PASSWORD" ]; then
            echo "::warning::PGXN_USER/PGXN_PASSWORD secrets not set; skipping PGXN upload."
            echo "Set them as repository secrets (a https://manager.pgxn.org account) to publish."
            exit 0
          fi
          # PGXN Manager upload API. 2xx/3xx = accepted; 409 = this version is
          # already published (idempotent re-run); anything else is a real failure.
          code=$(curl -sS -o /tmp/pgxn_resp.txt -w '%{http_code}' \
            --user "$PGXN_USERNAME:$PGXN_PASSWORD" \
            -F "archive=@${{ steps.dist.outputs.zip }};type=application/zip" \
            https://manager.pgxn.org/upload)
          echo "PGXN upload HTTP $code"; cat /tmp/pgxn_resp.txt || true
          case "$code" in
            2*|3*) echo "PGXN upload accepted." ;;
            409)   echo "::warning::PGXN reports this version already published; skipping." ;;
            *)     echo "::error::PGXN upload failed (HTTP $code) -- verify PGXN_USER/PGXN_PASSWORD and META.json"; exit 1 ;;
          esac

      - name: Announce to PostgreSQL news/announce
        env:
          PGORG_USER: ${{ secrets.PGORG_USER }}
          PGORG_PASSWORD: ${{ secrets.PGORG_PASSWORD }}
        run: |
          if [ -z "$PGORG_USER" ] || [ -z "$PGORG_PASSWORD" ]; then
            echo "PGORG_USER/PGORG_PASSWORD secrets not set; skipping announcement."
            exit 0
          fi
          bash ci/announce.sh "${{ steps.ver.outputs.version }}"
